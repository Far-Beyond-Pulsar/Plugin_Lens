[package]
name = "lens_component"
version = "0.1.0"
edition = "2024"
description = "Camera lenses (pulsar.lens): the camera lens component, its rows, presets, scene rows and view overscan, and the plugin's Helio feature set (lens, flare)"

# The plugin's root crate (`lens_plugin`) links it and submits its
# component class, scene rows, view overscan and render features.
[lib]
name = "lens_component"

[features]
# `#[derive(SceneStore)]` checks the deriving crate's own `gpu` feature.
default = ["gpu"]
gpu = []

[dependencies]
engine_class_derive = { workspace = true }
pulsar_reflection = { workspace = true }
pulsar_scenedb = { workspace = true }
pulsar_scenedb_derive = { workspace = true }
pulsar_world_registry = { workspace = true }
pulsar_scene_model = { workspace = true }
helio_component = { workspace = true }
# The engine-class derive logs through it.
tracing = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
bytemuck = { workspace = true, features = ["derive"] }
wgpu = { workspace = true }
helio-feature-api = { workspace = true }
helio-scene-join = { workspace = true }
helio-pass-lens = { workspace = true }
helio-pass-flare = { workspace = true }
helio-lens-api = { workspace = true }

[lints]
workspace = true
