# The `pulsar.lens` plugin's descriptor. A project enables or disables it in
# its Pulsar.toml (`[plugins]`); disabled, its kind is absent (see
# crates/core/pulsar_plugins). Its root crate carries this file
# (`pulsar_plugins::installed!`).
id = "pulsar.lens"
name = "Camera Lens"
description = "A camera's physically based lens: its component, presets, rows and the renderer features that resolve the image through it and draw its flare"
enabled_by_default = true
provides = [
  { id = "pulsar.lens.rows", kind = "buffer", members = ["camera_lenses", "lens_elements"] },
]
# Optional: the lens flare runs without lights on the frame's stand-in.
requires = [
  { id = "pulsar.lights.rows", optional = true },
  { id = "pulsar.lights.api", optional = true },
]

# The plugin's root crate (the package in this directory): the one place it
# registers everything it contributes. A game links it without its `editor`
# feature; the editor links it with.
root = "lens_plugin"
