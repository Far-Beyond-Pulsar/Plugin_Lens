[package]
name = "lens_plugin"
version = "0.1.0"
edition = "2024"
publish = false
description = "Camera Lens (`pulsar.lens`): the plugin's root crate, the one place it registers everything it contributes (runtime registrations always, the editor's with `editor`)"
# `examples/` is the plugin's examples crate, not this package's examples.
autoexamples = false

[features]
# The inspector's editor of the element stack (a reflected list). Hosts
# turn it on with the rest of the installed set's editor registrations.
editor = ["dep:ui_common"]

[dependencies]
# The plugin gate and the registrations' collection.
pulsar_plugins = { workspace = true }
# The plugin's crates.
lens_component = { workspace = true }
# The engine seams the plugin registers into.
engine_backend = { path = "../../../crates/core/engine_backend", default-features = false, features = ["render"] }
pulsar_world_registry = { workspace = true }
# The editor's reflected list editor (with `editor`).
ui_common = { workspace = true, optional = true }

[dev-dependencies]
# The plugin's integration tests (`tests/`): the plugin as a game links it.
helio = { workspace = true }
helio-core = { workspace = true }
helio-pass-lens = { workspace = true }
helio-scene-join = { workspace = true }
pulsar_scenedb = { workspace = true }
wgpu = { workspace = true }
bytemuck = { workspace = true }
glam = { workspace = true }
pollster = "=0.4.0"

[lints]
workspace = true
